name: Testes Automatizados ServeRest
'on':
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: null
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Executar Testes com Maven
        run: mvn clean test
      - name: Gerar Allure Report HTML
        if: always()
        run: 'mvn allure:report'
      - name: Salvar Artefato HTML do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: target/site/allure-maven-plugin
          retention-days: 5
